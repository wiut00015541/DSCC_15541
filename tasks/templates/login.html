{% extends 'base.html' %}

{% block content %}

<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Welcome Back, Darling</h2>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label>Password</label>
                {{ form.password }}
            </div>

            <button class="btn-primary" type="submit">Login</button>
        </form>

        <p class="auth-link">
            No account?
            <a href="{% url 'register' %}">Register</a>
        </p>
    </div>
</div>

{% endblock %}
